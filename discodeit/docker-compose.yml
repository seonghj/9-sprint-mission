services:
  nginx:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./src/main/resources/static:/usr/share/nginx/html:ro
    networks:
      - discodeit-net
    depends_on:
      - backend

  backend:
    build: .
    deploy:
      mode: replicated
      replicas: 3
    networks:
      - discodeit-net
    env_file:
      - .env
    environment:
      - DB_URL=jdbc:postgresql://db:5432/discodeit
      - REDIS_HOST=redis
      - KAFKA_BOOTSTRAP_SERVERS=broker:9092
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=broker:9092
    depends_on:
      - db
      - redis
      - broker

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: discodeit
      # 🌟 하드코딩 삭제: .env 파일의 계정 정보로 DB를 생성하도록 연동
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    networks:
      - discodeit-net

  redis:
    image: redis:alpine
    networks:
      - discodeit-net

  broker:
    image: confluentinc/cp-kafka:latest
    networks:
      - discodeit-net
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@broker:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://broker:29093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://broker:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'

networks:
  discodeit-net:
    driver: bridge