server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://db:5432/discodeit}
    username: ${DB_USERNAME:myuser}
    password: ${DB_PASSWORD:mypassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

discodeit:
  storage:
    type: ${STORAGE_TYPE:local}
    local:
      root-path: /var/lib/discodeit/storage
    s3:
      access-key: ${AWS_S3_ACCESS_KEY:dummy-access-key}
      secret-key: ${AWS_S3_SECRET_KEY:dummy-secret-key}
      region: ${AWS_S3_REGION:ap-northeast-2}
      bucket: ${AWS_S3_BUCKET:dummy-bucket}